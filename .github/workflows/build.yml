# ============================================================
#  Build LaTeX — Engineering AI Agents for Production Vol. 2
#
#  ROOT CAUSE OF PREVIOUS FAILURE:
#  `cd Tex` moved CWD to Tex/, so \input{Tex/preamble} became
#  Tex/Tex/preamble.tex — not found.
#
#  FIX: Run latexmk from repo root (no cd). The .tex file
#  is referenced as Tex/main.tex. All \input{Tex/...} paths
#  in main.tex resolve correctly from repo root.
#  -output-directory is set to Tex/Output (repo-root-relative).
#
#  xu-cheng/texlive-action mounts the workspace at
#  GITHUB_WORKSPACE and sets CWD to it — so repo root is
#  always the working directory inside the container.
# ============================================================
name: Build LaTeX to PDF

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p Tex/Output

      - name: Compile LaTeX (XeLaTeX via latexmk)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            latexmk \
              -xelatex \
              -interaction=nonstopmode \
              -halt-on-error \
              -output-directory=Tex/Output \
              Tex/main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: Tex/Output/main.pdf
          if-no-files-found: error
