# ============================================================
#  Build LaTeX — Engineering AI Agents for Production Vol. 2
#
#  FIXES applied vs previous version:
#  1. Added -f (force) flag — latexmk now runs all passes
#     needed to resolve cross-references (\ref, \label,
#     \lstref etc.) instead of bailing on pass-1 warnings.
#  2. Removed -halt-on-error — combined with -f it caused
#     exit code 12 on unresolved refs; -interaction=nonstopmode
#     is sufficient to keep the run going through warnings.
# ============================================================
name: Build LaTeX to PDF

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p Tex/Output

      - name: Compile LaTeX (XeLaTeX via latexmk)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            latexmk \
              -xelatex \
              -f \
              -interaction=nonstopmode \
              -output-directory=Tex/Output \
              Tex/main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: Tex/Output/main.pdf
          if-no-files-found: error
